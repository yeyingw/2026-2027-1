<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>成中医 2023级 2026秋 总课表 · 6门课+技能训练（点击详情·滑动查看）</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f0f2f5;
        color: #333;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      /* ---- 新增：header 相对定位，为角标提供基准 ---- */
      .header {
        position: relative;
        background: linear-gradient(135deg, #1a237e, #283593);
        color: white;
        padding: 24px 32px;
        border-radius: 12px 12px 0 0;
      }
      .header h1 {
        font-size: 22px;
        margin-bottom: 6px;
      }
      .mobile-break {
        display: none;
      }
      .header .subtitle {
        font-size: 13px;
        opacity: 0.9;
      }
      /* 新增：副标题强制两行（电脑、手机一致） */
      .header .subtitle .sub-line {
        display: block;
        line-height: 1.7;
      }

      /* ---- 新增：GitHub 角标样式 ---- */
      .github-corner {
        position: absolute;
        top: 16px;
        right: 20px;
        z-index: 5;
        color: #fff;
        transition: opacity 0.2s;
        line-height: 0;
      }
      .github-corner:hover {
        opacity: 0.75;
      }
      .github-corner svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
      }

      .controls {
        background: white;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        border-bottom: 1px solid #e8e8e8;
      }
      .controls label {
        font-size: 14px;
        font-weight: 500;
      }
      .week-selector {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .week-btn {
        min-width: 36px;
        height: 36px;
        padding: 0 8px;
        border: 1px solid #d9d9d9;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
        position: relative;
      }
      .week-btn:hover {
        border-color: #1a237e;
        color: #1a237e;
      }
      .week-btn.active {
        background: #1a237e;
        color: white;
        border-color: #1a237e;
      }
      .week-btn.has-class {
        font-weight: bold;
        position: relative;
      }
      .week-btn.has-class::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        background: #ff6b35;
        border-radius: 50%;
      }
      .week-btn.active.has-class::after {
        background: white;
      }
      .week-btn.current-week {
        border-color: #ff6b35;
        box-shadow: 0 0 0 1px #ff6b35;
      }
      .week-btn.current-week .star {
        color: #ff6b35;
        font-size: 12px;
        margin-left: 1px;
      }
      .week-btn.active.current-week .star {
        color: #ffd54f;
      }

      .today-btn {
        padding: 0 16px;
        height: 36px;
        border: 1px solid #1a237e;
        background: #1a237e;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
        white-space: nowrap;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .today-btn:hover {
        background: #283593;
        border-color: #283593;
      }
      .today-btn:active {
        transform: scale(0.96);
      }
      .today-btn .badge {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 0 8px;
        font-size: 11px;
        line-height: 18px;
        margin-left: 2px;
      }

      .date-info {
        margin-left: auto;
        font-size: 14px;
        color: #666;
        white-space: nowrap;
      }

      .weekend-hint {
        display: none;
        margin-left: 8px;
        font-size: 12px;
        color: #ff6b35;
        background: #fff3e0;
        padding: 2px 8px;
        border-radius: 4px;
        vertical-align: middle;
        white-space: nowrap;
      }
      .weekend-hint.show {
        display: inline-block;
      }

      @media (max-width: 768px) {
        .weekend-hint {
          margin-left: 0;
          margin-top: 4px;
          font-size: 11px;
        }
        .weekend-hint.show {
          display: block;
        }
      }

      .filter-bar {
        background: white;
        padding: 10px 32px;
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
        border-bottom: 1px solid #e8e8e8;
        font-size: 13px;
        position: relative;
      }
      .filter-label {
        font-weight: 500;
        color: #555;
        white-space: nowrap;
      }
      .subject-filter-wrap {
        display: flex;
        align-items: center;
        gap: 8px 10px;
        flex-wrap: wrap;
        flex: 1 1 auto;
      }
      .subject-filter-wrap .filter-label {
        flex-shrink: 0;
      }
      .subject-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        align-items: center;
        transition: all 0.25s ease;
      }
      .chips-row {
        display: contents; /* 让 chip 直接参与外层换行，单选/多选跟在科目后面 */
      }
      .filter-chip {
        padding: 4px 12px;
        border-radius: 14px;
        cursor: pointer;
        border: 1px solid #ddd;
        background: white;
        transition: all 0.2s;
        user-select: none;
        margin: 2px 0;
        font-size: 13px;
      }
      .filter-chip:hover {
        opacity: 0.8;
      }
      .filter-chip.off {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .filter-chip .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }

      .subject-toggle-btn {
        display: none;
        background: #f0f2f5;
        border: 1px solid #d9d9d9;
        border-radius: 14px;
        padding: 2px 14px 2px 10px;
        font-size: 13px;
        cursor: pointer;
        color: #333;
        font-weight: 500;
        line-height: 30px;
        white-space: nowrap;
        align-items: center;
        gap: 4px;
        user-select: none;
      }
      .subject-toggle-btn .arrow {
        transition: transform 0.25s;
        display: inline-block;
        font-size: 12px;
      }
      .subject-toggle-btn .arrow.open {
        transform: rotate(180deg);
      }

      .group-filter {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        flex-shrink: 0;
        margin-left: auto;
      }
      .group-btn {
        padding: 4px 12px;
        border: 1px solid #d9d9d9;
        background: white;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }
      .group-btn.active {
        background: #1a237e;
        color: white;
        border-color: #1a237e;
      }
      .legend {
        display: flex;
        gap: 16px;
        padding: 10px 32px;
        background: #fafafa;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }

      .schedule-wrapper {
        background: white;
        border-radius: 0 0 12px 12px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        border: 1px solid #e8e8e8;
        border-top: none;
        position: relative;
      }
      .schedule-grid {
        display: grid;
        grid-template-columns: 60px repeat(7, minmax(160px, 1fr));
        min-width: 100%;
        width: max-content;
        grid-auto-rows: 55px;
      }
      .grid-header {
        background: #f5f7fa;
        padding: 10px 6px;
        text-align: center;
        font-weight: 600;
        font-size: 13px;
        border-right: 1px solid #e8e8e8;
        border-bottom: 2px solid #1a237e;
      }
      .grid-header .date {
        font-size: 10px;
        color: #888;
        font-weight: normal;
        margin-top: 2px;
      }

      .time-col {
        background: #fafafa;
        border-right: 1px solid #e8e8e8;
        position: -webkit-sticky;
        /* position: sticky;
        left: 0; */
        z-index: 10;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.06);
      }
      .time-col .time-slot {
        background: inherit;
      }

      .time-slot {
        padding: 4px 4px;
        font-size: 10px;
        color: #888;
        text-align: right;
        border-bottom: 1px solid #f0f0f0;
        line-height: 1.3;
      }
      .day-col {
        border-right: 1px solid #e8e8e8;
        position: relative;
        min-height: 720px;
        min-width: 140px;
      }
      .day-col:last-child {
        border-right: none;
      }
      .day-cell {
        border-bottom: 1px solid #f0f0f0;
      }

      .course-card {
        position: absolute;
        border-radius: 5px;
        padding: 5px 7px;
        font-size: 16px;
        color: white;
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
        z-index: 2;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        border-left: 3px solid rgba(255, 255, 255, 0.5);
        word-break: break-word;
      }
      .course-card:active {
        transform: scale(0.97);
      }
      .course-card.practice {
        border-left: 3px solid #fff;
        border-style: dashed;
        border-left-width: 3px;
      }
      .course-card .subject-tag {
        font-size: 11px;
        opacity: 0.85;
        margin-bottom: 2px;
        font-weight: 600;
      }
      .course-card .course-name {
        font-weight: 600;
        line-height: 1.25;
        margin-bottom: 2px;
        font-size: 14px;
      }
      .course-card .course-meta {
        font-size: 13px;
        opacity: 0.9;
        line-height: 1.3;
      }
      .course-card .group-tag {
        display: inline-block;
        background: rgba(255, 255, 255, 0.25);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 11px;
        margin-top: 2px;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 20px;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: white;
        border-radius: 16px;
        max-width: 420px;
        width: 100%;
        padding: 24px 28px 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        position: relative;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .modal-close {
        position: absolute;
        top: 12px;
        right: 16px;
        font-size: 24px;
        cursor: pointer;
        color: #999;
        line-height: 1;
        background: none;
        border: none;
      }
      .modal-close:hover {
        color: #333;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 700;
        color: #1a237e;
        margin-bottom: 12px;
        padding-right: 30px;
      }
      .modal-detail {
        font-size: 15px;
        line-height: 1.8;
        color: #333;
      }
      .modal-detail .label {
        font-weight: 600;
        color: #555;
        display: inline-block;
        width: 70px;
      }
      .modal-detail .value {
        color: #222;
      }
      .modal-detail .divider {
        border-top: 1px solid #eee;
        margin: 12px 0;
      }

      .footer {
        text-align: center;
        padding: 16px;
        color: #999;
        font-size: 20px;
      }
      .stats {
        background: white;
        padding: 8px 32px;
        font-size: 12px;
        color: #666;
        border-top: 1px solid #eee;
      }

      @media (max-width: 768px) {
        body {
          padding: 10px;
        }
        .header {
          padding: 16px 20px;
        }
        .header h1 {
          font-size: 18px;
          line-height: 1.45;
        }
        .mobile-break {
          display: block;
        }
        /* 手机端角标稍小 */
        .github-corner svg {
          width: 28px;
          height: 28px;
        }
        .github-corner {
          top: 12px;
          right: 14px;
        }
        .controls {
          padding: 12px 16px;
          gap: 10px;
        }
        .today-btn {
          height: 32px;
          font-size: 12px;
          padding: 0 12px;
        }
        .today-btn .badge {
          font-size: 10px;
          padding: 0 6px;
          line-height: 16px;
        }
        .filter-bar {
          padding: 8px 16px;
          gap: 6px 10px;
          flex-wrap: wrap;
        }
        .filter-chip {
          padding: 3px 10px;
          font-size: 12px;
          margin: 2px 0;
        }
        .legend {
          padding: 8px 16px;
          font-size: 11px;
          gap: 10px;
        }
        .schedule-grid {
          grid-template-columns: 55px repeat(7, minmax(150px, 1fr));
        }
        .grid-header {
          font-size: 13px;
          padding: 6px 4px;
        }
        .grid-header .date {
          font-size: 10px;
        }
        .time-slot {
          font-size: 11px;
        }
        .course-card {
          font-size: 14px;
          padding: 6px 7px;
        }
        .course-card .subject-tag {
          font-size: 11px;
          margin-bottom: 3px;
        }
        .course-card .course-name {
          font-size: 14px;
          margin-bottom: 3px;
        }
        .course-card .course-meta {
          font-size: 13px;
          line-height: 1.4;
        }
        .course-card .group-tag {
          font-size: 10px;
          padding: 2px 6px;
        }
        .day-col {
          min-width: 130px;
          min-height: 660px;
        }
        .modal-box {
          max-width: 95%;
          padding: 20px;
        }
        .modal-title {
          font-size: 18px;
        }
        .modal-detail {
          font-size: 14px;
        }
        .group-filter {
          margin-left: 0;
          width: 100%;
          justify-content: flex-start;
        }
        .time-col {
          box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1);
        }

        .subject-toggle-btn {
          display: inline-flex;
        }
        .subject-filter-wrap .filter-label {
          display: none;
        }
        .subject-chips {
          display: none;
          width: 100%;
          padding-top: 6px;
          border-top: 1px solid #eee;
          margin-top: 4px;
        }
        .subject-chips.open {
          display: flex;
        }
        .filter-bar {
          flex-wrap: wrap;
        }
        .subject-filter-wrap {
          flex: 1 1 100%;
          flex-wrap: wrap;
        }
        .subject-filter-wrap .filter-label {
          display: none;
        }
        .group-filter {
          margin-left: 0;
          width: 100%;
          justify-content: flex-start;
          border-top: 1px solid #f0f0f0;
          padding-top: 6px;
          margin-top: 2px;
        }
        .group-filter .filter-label {
          display: inline;
        }
        .controls {
          gap: 8px;
        }
        .week-selector {
          flex: 1 1 100%;
          order: 2;
        }
        .today-btn {
          order: 1;
          margin-right: auto;
        }
        .date-info {
          order: 3;
          margin-left: 0;
          width: 100%;
          font-size: 13px;
        }
      }

      @media (max-width: 480px) {
        .schedule-grid {
          grid-template-columns: 50px repeat(7, minmax(130px, 1fr));
        }
        .day-col {
          min-width: 120px;
        }
        .course-card {
          font-size: 13px;
          padding: 4px 5px;
        }
        .course-card .subject-tag {
          font-size: 10px;
        }
        .course-card .course-name {
          font-size: 13px;
        }
        .course-card .course-meta {
          font-size: 11px;
        }
        .time-slot {
          font-size: 10px;
        }
        .today-btn {
          font-size: 11px;
          padding: 0 10px;
          height: 28px;
        }
        .today-btn .badge {
          font-size: 9px;
          padding: 0 5px;
          line-height: 14px;
        }
        .github-corner svg {
          width: 24px;
          height: 24px;
        }
        .github-corner {
          top: 10px;
          right: 12px;
        }
      }

      /* ============================================================
         新增：模式切换（课表模式 / 考试模式）
         ============================================================ */
      .mode-switch {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: #eef0f5;
        border-radius: 8px;
        padding: 3px;
        flex-shrink: 0;
      }
      .mode-btn {
        border: none;
        background: transparent;
        height: 30px;
        padding: 0 14px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
      }
      .mode-btn:hover {
        color: #1a237e;
      }
      .mode-btn.active {
        background: #1a237e;
        color: #fff;
        box-shadow: 0 1px 4px rgba(26, 35, 126, 0.28);
      }
      .mode-btn.active[data-mode="exam"] {
        background: #c62828;
        color: #fff;
        box-shadow: 0 1px 4px rgba(198, 40, 40, 0.35);
      }

      /* 新增：科目筛选模式（单选 / 多选） */
      .filter-mode {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .fm-btn {
        height: 26px;
        padding: 0 11px;
        border: 1px solid #d9d9d9;
        background: #fff;
        color: #666;
        border-radius: 13px;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
      }
      .fm-btn:hover {
        border-color: #1a237e;
        color: #1a237e;
      }
      .fm-btn.active {
        background: #1a237e;
        border-color: #1a237e;
        color: #fff;
        font-weight: 600;
      }
      body.exam-mode .fm-btn.active {
        background: #c62828;
        border-color: #c62828;
      }
      .filter-tip {
        font-size: 11px;
        color: #aaa;
        white-space: nowrap;
      }
      .filter-chip.on {
        font-weight: 600;
      }
      .reset-chip {
        border: 1px dashed #c62828 !important;
        background: #fff !important;
        color: #c62828 !important;
        font-weight: 600;
      }

      .exam-cd-inline {
        font-weight: 700;
        color: #c62828;
      }
      .exam-cd-inline.cd-over {
        color: #999;
      }
      .exam-cd-inline.cd-live {
        color: #2e7d32;
      }

      /* 新增：考试模式概览条 */
      .exam-overview {
        display: none;
        background: #fff;
        border-bottom: 1px solid #eee;
        padding: 12px 32px;
      }
      body.exam-mode .exam-overview {
        display: block;
      }
      .eo-main {
        display: flex;
        align-items: center;
        gap: 10px 14px;
        flex-wrap: wrap;
      }
      .eo-tag {
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: #c62828;
        border-radius: 4px;
        padding: 2px 8px;
      }
      .eo-tag.done {
        background: #9e9e9e;
      }
      .eo-name {
        font-size: 17px;
        font-weight: 700;
        color: #c62828;
      }
      .eo-meta {
        font-size: 13px;
        color: #555;
      }
      .eo-cd {
        margin-left: auto;
        font-size: 20px;
        font-weight: 800;
        color: #c62828;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }
      .eo-cd.cd-over {
        color: #9e9e9e;
      }
      .eo-cd.cd-live {
        color: #2e7d32;
      }
      .eo-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        margin-top: 10px;
      }
      .eo-item {
        font-size: 11px;
        color: #666;
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 2px 9px;
        white-space: nowrap;
      }
      .eo-item b {
        color: #c62828;
        font-weight: 700;
        margin-right: 4px;
      }
      .eo-item em {
        font-style: normal;
        color: #8e0000;
        font-weight: 600;
        margin-left: 4px;
      }
      .eo-item em.cd-over {
        color: #aaa;
        text-decoration: line-through;
      }

      /* 新增：考试列头 */

        const startMin = START_HOUR * 60;

      // ============================================================
      //  3. 解析 CSV
      // ============================================================
      function parseCSV(text) {
        const lines = text.split("\n").filter((line) => line.trim() !== "");
        const result = [];
        for (let i = 1; i < lines.length; i++) {
          const row = parseCSVLine(lines[i]);
          if (row.length < 9) continue;
          const obj = {
            week: parseInt(row[0]),
            day: parseInt(row[1]),
            start: row[2].trim(),
            end: row[3].trim(),
            name: row[4].trim(),
            teacher: row[5].trim(),
            classroom: row[6].trim(),
            type: row[7].trim() === "见习" ? "practice" : "theory",
            subjectRaw: row[8].trim(),
          };
          let subject = subjectMap[obj.subjectRaw] || obj.subjectRaw;
          if (obj.subjectRaw.includes("外科见习")) subject = "外科学";
          else if (obj.subjectRaw.includes("内科见习")) subject = "内科学";
          else if (obj.subjectRaw.includes("皮肤见习")) subject = "皮肤性病学";
          else if (obj.subjectRaw.includes("耳鼻喉见习"))
            subject = "耳鼻咽喉头颈外科学";
          else if (obj.subjectRaw.includes("传染见习")) subject = "传染病学";
          obj.subject = subject;
          const groupMatch = obj.name.match(
            /【第([1-2])组】|第([1-2])组|第1、2组/,
          );
          if (groupMatch) {
            if (groupMatch[0] === "第1、2组") obj.group = "第1、2组";
            else obj.group = "第" + (groupMatch[1] || groupMatch[2]) + "组";
          } else {
            obj.group = "";
          }
          obj.full_name = obj.name;
          result.push(obj);
        }
        return result;
      }

      function parseCSVLine(line) {
        const parts = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            inQuotes = !inQuotes;
          } else if (ch === "," && !inQuotes) {
            parts.push(current);
            current = "";
          } else {
            current += ch;
          }
        }
        parts.push(current);
        return parts;
      }

      const EXAM_END_HOUR = END_HOUR - 1;

      function parseYMD(str) {
        const parts = str.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      const exams = examData
        .map((e, i) => {
          const d = parseYMD(e.date);
          const dayIdx = (d.getDay() + 6) % 7; // 0 = 周一
          const diffDays = Math.round((d - SEMESTER_START) / 86400000);
          const week = Math.floor(diffDays / 7) + 1;
          const sh = parseInt(e.start.split(":")[0], 10);
          const sm = parseInt(e.start.split(":")[1], 10);
          const eh = parseInt(e.end.split(":")[0], 10);

            id: "ex" + i,

            start: e.start,

            dateObj: d,
            week: week,
            day: dayIdx + 1,
            startAt: new Date(
              d.getFullYear(),

              d.getDate(),
              sh,

      // 辅助：如果 URL 带 ?dow=6，就用参数模拟星期
      function getDayOfWeek() {
        const p = new URLSearchParams(location.search).get("dow");
        if (p !== null) return parseInt(p, 10);
        return new Date().getDay();
      }
      function getCurrentWeek() {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const start = new Date(SEMESTER_START);
        if (now < start) return 1;
        const diffDays = (now - start) / (1000 * 60 * 60 * 24);
        let week = Math.floor(diffDays / 7) + 1;
        // 周六(6)、周日(0) 自动视为下一周，方便提前看下周课表
        const dow = getDayOfWeek();
        if (dow === 6 || dow === 0) week += 1;
        // 最后一周封顶，不会再往后跳
        return Math.min(week, TOTAL_WEEKS);
      }

      function renderGrid() {

      // 一天的课程卡片（原 renderGrid 里的排版逻辑，抽出来复用）
      function dayCardsHTML(dayCourses) {
        let html = "";
        const timeGroups = {};
        dayCourses.forEach((c) => {
          const key = `${c.start}|${c.end}`;
          if (!timeGroups[key]) timeGroups[key] = [];
          timeGroups[key].push(c);
        });

        Object.values(timeGroups).forEach((group) => {
          const count = group.length;
          const gapPct = 0.8;
          const marginPct = 0.5;
          const totalGap = (count - 1) * gapPct + 2 * marginPct;
          const widthPct = (100 - totalGap) / count;

          group.forEach((c, idx) => {
            const leftPct = marginPct + idx * (widthPct + gapPct);
            const startMin = timeToMinutes(c.start);
            const endMin = timeToMinutes(c.end);

            const top = getCumulativeHeight(startMin);
            const bottom = getCumulativeHeight(endMin);
            const height = Math.max(bottom - top - 2, 28);

            const color = subjectColors[c.subject] || "#666";
            const isPrac = c.type === "practice";
            const groupHtml = c.group
              ? `<span class="group-tag">${c.group}</span>`
              : "";
            const displayName = c.name.split("\n")[0];

            html += `
                    <div class="course-card ${isPrac ? "practice" : ""}" 
                         style="top:${top}px; height:${height}px; left:${leftPct}%; width:${widthPct}%; background:linear-gradient(135deg, ${color}, ${color}dd);"
                         data-subject="${c.subject}"
                         data-name="${c.full_name}"
                         data-teacher="${c.teacher}"
                         data-time="${c.start} - ${c.end}"
                         data-group="${c.group || "全班"}"

                         onclick="showDetail(this)">

                        <div class="course-meta">👤 ${c.teacher}<br>⏰ ${c.start}-${c.end}</div>
                        ${groupHtml}
                    </div>
                    `;
          });
        });

        return html;

      // ============================================================
      const DAY_FULL = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

      function examState(ex, now) {
        const t = now || Date.now();
        if (t >= ex.endAt.getTime()) return "over";
        if (t >= ex.startAt.getTime()) return "live";
        return "future";
      }

      function fmtCountdown(ex, now) {
        const t = now || Date.now();
        const st = examState(ex, t);
        if (st === "over") return "已结束";
        if (st === "live") return "🟢 正在考试";
        const total = Math.floor((ex.startAt.getTime() - t) / 1000);
        const d = Math.floor(total / 86400);
        const h = Math.floor((total % 86400) / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        if (d > 0) return h > 0 ? `还有 ${d}天${h}小时` : `还有 ${d}天`;
        if (h > 0) return `还有 ${h}小时${m}分`;
        if (m > 0) return `还有 ${m}分${s}秒`;
        return `还有 ${s}秒`;
      }

      function fmtCountdownFull(ex, now) {
        const t = now || Date.now();
        const st = examState(ex, t);
        if (st === "over") return "已结束";
        if (st === "live") return "考试进行中";
        const total = Math.floor((ex.startAt.getTime() - t) / 1000);
        const d = Math.floor(total / 86400);
        const h = Math.floor((total % 86400) / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        const pad = (n) => String(n).padStart(2, "0");
        const hms = `${pad(h)}:${pad(m)}:${pad(s)}`;
        return d > 0 ? `${d}天 ${hms}` : hms;
      }

      function examCardHTML(ex) {
        const color =
          EXAM_CARD_STYLE === "subject"
            ? subjectColors[ex.subject] || "#c62828"
            : "#c62828";
        const bg =
          EXAM_CARD_STYLE === "subject"
            ? `linear-gradient(135deg, ${color}, ${color}dd)`
            : "linear-gradient(135deg, #c62828, #8e0000)";
        // 所有考试卡等高；若贴近底部则整体上移，避免被裁
        const total = axisTotalHeight();
        let top = getCumulativeHeight(timeToMinutes(ex.start));
        if (top + EXAM_CARD_HEIGHT > total) {
          top = Math.max(0, total - EXAM_CARD_HEIGHT);
        }
        const height = EXAM_CARD_HEIGHT;
        return `
                <div class="course-card exam-card"
                     style="top:${top}px; height:${height}px; left:0.5%; width:99%; background:${bg};"
                     data-exam-id="${ex.id}"
                     onclick="showExamDetail(this)">
                    <div class="exam-flag">🎯 期末考试</div>
                    <div class="course-name">${ex.subject}</div>
                    <div class="course-meta">🕐 ${ex.start}-${ex.end}<br>📍 ${ex.place}</div>
                    <div class="exam-cd" data-cd-exam="${ex.id}" data-cd-mode="short">${fmtCountdown(ex)}</div>
                </div>`;
      }

      // 考试模式：一列一场考试，列头 = 日期 + 周几 + 倒计时
      function renderExamGrid() {
        axisMode = "exam";
        const grid = document.getElementById("scheduleGrid");
        const colExams = exams.filter((e) => isSubjectVisible(e.subject));
        const hours = [];
        for (let h = START_HOUR; h <= EXAM_END_HOUR; h++) hours.push(h);
        const totalHeight = hours.reduce((sum, h) => sum + getHourHeight(h), 0);
        const cols = Math.max(colExams.length, 1);
        const filtered = getFilteredCourses();

        grid.style.gridTemplateColumns = `60px repeat(${cols}, minmax(200px, 1fr))`;
        grid.style.gridTemplateRows =
          "78px " + hours.map((h) => getHourHeight(h) + "px").join(" ");
        grid.style.width = "100%";
        const colMinWidth = window.innerWidth <= 768 ? 160 : 200;
        grid.style.minWidth = cols * colMinWidth + 60 + "px";

        let html = `<div class="grid-header" style="border-bottom:2px solid #c62828">时间</div>`;
        if (colExams.length === 0) {
          html += `<div class="grid-header exam-head"><div class="ed-date">—</div><div class="ed-sub">未选择考试科目</div></div>`;
        }
        colExams.forEach((ex) => {
          html += `<div class="grid-header exam-head">
                    <div class="ed-date">${ex.monthDay}</div>
                    <div class="ed-sub">${DAY_FULL[ex.day - 1]} · 第${ex.week}周</div>
                    <div class="ed-cd" data-cd-exam="${ex.id}" data-cd-mode="short">${fmtCountdown(ex)}</div>
                  </div>`;
        });

        html += `<div class="time-col" style="height:${totalHeight}px;">`;
        hours.forEach((h) => {
          html += `<div class="time-slot" style="height:${getHourHeight(h)}px;">${h}:00</div>`;
        });
        html += "</div>";

        colExams.forEach((ex) => {
          html += `<div class="day-col" style="height:${totalHeight}px;min-height:0;">`;
          hours.forEach((h) => {
            html += `<div class="day-cell" style="height:${getHourHeight(h)}px;"></div>`;
          });
          const dayCourses = filtered.filter(
            (c) => c.week === ex.week && c.day === ex.day,
          );
          html += dayCardsHTML(dayCourses);
          html += examCardHTML(ex);
          html += "</div>";
        });

        grid.innerHTML = html;
      }

      // 考试模式顶部：下一场 + 5 场倒计时
      function renderExamOverview() {
        const el = document.getElementById("examOverview");
        if (!el) return;
        const now = Date.now();
        const next = exams.find((e) => e.endAt.getTime() > now);
        const finished = exams.filter((e) => e.endAt.getTime() <= now).length;

        if (!next) {
          overviewNextId = null;
          el.innerHTML = `<div class="eo-main"><span class="eo-tag done">全部结束</span><span class="eo-name">5 场期末考试已全部结束</span><span class="eo-meta">已结束 ${finished}/${exams.length} 场</span></div>`;
          return;
        }

        overviewNextId = next.id;
        el.innerHTML = `
          <div class="eo-main">
            <span class="eo-tag">下一场</span>
            <span class="eo-name">${next.subject}</span>
            <span class="eo-meta">${next.date} ${DAY_FULL[next.day - 1]} ${next.start}-${next.end} · ${next.place}</span>
            <span class="eo-cd" data-cd-exam="${next.id}" data-cd-mode="full">${fmtCountdownFull(next)}</span>
          </div>
          <div class="eo-list">
            ${exams
              .map(
                (e) =>
                  `<span class="eo-item"><b>${e.monthDay}</b>${e.subject}<em data-cd-exam="${e.id}">${fmtCountdown(e)}</em></span>`,
              )
              .join("")}
            <span class="eo-item">已完成 ${finished}/${exams.length} 场</span>
          </div>`;
      }

      // 每秒刷新所有倒计时
      function updateCountdowns() {
        document.querySelectorAll("[data-cd-exam]").forEach((el) => {
          const ex = examMap[el.dataset.cdExam];
          if (!ex) return;
          el.textContent =
            el.dataset.cdMode === "full"
              ? fmtCountdownFull(ex)
              : fmtCountdown(ex);
          const st = examState(ex);
          el.classList.toggle("cd-over", st === "over");
          el.classList.toggle("cd-live", st === "live");
        });
        if (viewMode === "exam" && overviewNextId) {
          const ex = examMap[overviewNextId];
          if (ex && ex.endAt.getTime() <= Date.now()) renderExamOverview();
        }
      }

      function setViewMode(mode) {
        if (mode === viewMode) return;
        if (mode === "exam") {
          prevFilterMode = filterMode;
          filterMode = "single"; // 考试模式默认单选：点一科只看那一场
          // 考试模式默认显示全部 5 场；只有单独选中某一考试科目时才保留
          const examSubjects = new Set(exams.map((e) => e.subject));
          if (
            selectedSubjects.size > 1 ||
            [...selectedSubjects].some((x) => !examSubjects.has(x))
          ) {
            selectedSubjects.clear();
          }
        } else {
          filterMode = prevFilterMode || "single";
        }
        viewMode = mode;
        document.body.classList.toggle("exam-mode", mode === "exam");
        document.querySelectorAll(".mode-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.mode === mode);
        });
        renderAll();
        if (mode === "exam") {
          document.querySelector(".schedule-wrapper")?.scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        }
      }

      function setFilterMode(m) {
        filterMode = m;
        if (m === "single" && selectedSubjects.size > 1) {
          const first = [...selectedSubjects][0];
          selectedSubjects.clear();
          selectedSubjects.add(first);
        }
        renderAll();
      }

      function syncFilterModeUI() {
        document.querySelectorAll(".fm-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.fm === filterMode);
        });
        const tip = document.getElementById("filterTip");
        if (tip) {
          tip.textContent =
            filterMode === "single"
              ? "单选：点科目只看该科，再点一次回到全部"
              : "多选：可同时选多科，清空即全部";
        }
      }

      // ============================================================
      //  7. 模态框
      // ============================================================
      function showDetail(el) {
        const subject = el.dataset.subject;
        const name = el.dataset.name;
        const teacher = el.dataset.teacher;
        const time = el.dataset.time;
        const group = el.dataset.group;
        const classroom = el.dataset.classroom;

        document.getElementById("modalTitle").textContent = name;
        document.getElementById("modalDetail").innerHTML = `
            <div><span class="label">科目</span><span class="value">${subject}</span></div>
            <div><span class="label">教师</span><span class="value">${teacher}</span></div>
            <div><span class="label">时间</span><span class="value">${time}</span></div>
            <div><span class="label">组别</span><span class="value">${group}</span></div>
            <div><span class="label">教室</span><span class="value">${classroom}</span></div>
        `;
        document.getElementById("modalOverlay").classList.add("active");
      }

      function showExamDetail(el) {
        const ex = examMap[el.dataset.examId];
        if (!ex) return;
        document.getElementById("modalTitle").textContent =
          `${ex.subject} · 期末考试`;
        document.getElementById("modalDetail").innerHTML = `
            <div><span class="label">科目</span><span class="value">${ex.subject}</span></div>
            <div><span class="label">日期</span><span class="value">${ex.date} ${DAY_FULL[ex.day - 1]}（第${ex.week}周）</span></div>
            <div><span class="label">时间</span><span class="value">${ex.start} - ${ex.end}</span></div>
            ${ex.place ? `<div><span class="label">考场</span><span class="value">${ex.place}</span></div>` : ""}
            ${ex.paper ? `<div><span class="label">试卷号</span><span class="value">${ex.paper}</span></div>` : ""}
            ${ex.group ? `<div><span class="label">组别</span><span class="value">${ex.group}</span></div>` : ""}
            <div class="divider"></div>
            <div><span class="label">倒计时</span><span class="value exam-cd-inline" data-cd-exam="${ex.id}" data-cd-mode="short">${fmtCountdown(ex)}</span></div>
        `;
        document.getElementById("modalOverlay").classList.add("active");
      }

      document
        .getElementById("modalClose")
        .addEventListener("click", function () {
          document.getElementById("modalOverlay").classList.remove("active");
        });
      document
        .getElementById("modalOverlay")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            this.classList.remove("active");
          }
        });

      // ============================================================
      //  8. 统计 & 全部渲染
      // ============================================================
      function renderStats() {
        if (viewMode === "exam") {
          const visible = exams.filter((e) => isSubjectVisible(e.subject));
          const finished = visible.filter(
            (e) => e.endAt.getTime() <= Date.now(),
          ).length;
          document.getElementById("stats").textContent =
            `考试模式：共 ${exams.length} 场期末考试 · 当前显示 ${visible.length} 场 · 已结束 ${finished} 场`;
          return;
        }
        const filtered = getFilteredCourses();
        const weekCourses = filtered.filter((c) => c.week === currentWeek);
        const theoryCount = weekCourses.filter(
          (c) => c.type === "theory",
        ).length;
        const practiceCount = weekCourses.filter(
          (c) => c.type === "practice",
        ).length;
        const weekExamCount = exams.filter(
          (e) => e.week === currentWeek && isSubjectVisible(e.subject),
        ).length;
        document.getElementById("stats").textContent =
          `第${currentWeek}周共 ${weekCourses.length} 节课（理论 ${theoryCount} · 见习 ${practiceCount}）` +
          (weekExamCount ? ` · 期末考试 ${weekExamCount} 场` : "");
      }

      function renderAll() {
        renderWeekSelector();
        renderDateInfo();
        updateWeekendHint();
        renderSubjectFilters();
        renderLegend();
        if (viewMode === "exam") {
          renderExamOverview();
          renderExamGrid();
        } else {
          document.getElementById("examOverview").innerHTML = "";
          renderGrid();
        }
        renderStats();
        updateSubjectChipsVisibility();
        updateCountdowns();
      }

      // ============================================================
      //  9. 事件绑定
      // ============================================================
      document
        .getElementById("subjectToggleBtn")
        .addEventListener("click", toggleSubjectChips);

      document.getElementById("todayBtn").addEventListener("click", goToToday);

      let resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (window.innerWidth > 768) {
            subjectChipsOpen = true;
          }
          updateSubjectChipsVisibility();
        }, 150);
      });

      // ============================================================
      //  10. 启动
      // ============================================================
      currentWeek = getCurrentWeek();

      if (window.innerWidth <= 768) {
        subjectChipsOpen = false;
      } else {
        subjectChipsOpen = true;
      }
      renderAll();

      window.setGroup = setGroup;
      window.showDetail = showDetail;
      window.showExamDetail = showExamDetail;
      window.goToToday = goToToday;
      window.setViewMode = setViewMode;
      window.setFilterMode = setFilterMode;
      window.toggleSubjectChip = toggleSubjectChip;

      // 每秒刷新倒计时
      setInterval(updateCountdowns, 1000);
    </script>
  </body>
