const TOTAL_WEEKS = 17;
const DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
const START_HOUR = 8;
const END_HOUR = 18;
const HOUR_HEIGHT = 60; // px per hour
// 学期第一周周一日期
const SEMESTER_START = new Date('2026-08-31'); // 第1周周一
let currentWeek = 1;

function getWeekDates(weekNum) {
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(SEMESTER_START);
    d.setDate(d.getDate() + (weekNum - 1) * 7 + i);
    dates.push(d);
  }
  return dates;
}
function formatDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

// ===== 同时间课程并排布局：区间图着色 =====
function layoutCourses(courses) {
  const n = courses.length;
  if (n === 0) return [];
  const items = courses.map(c => ({ c, s: timeToMinutes(c.start), e: timeToMinutes(c.end) }));
  // 重叠邻接
  const adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (items[i].s < items[j].e && items[j].s < items[i].e) {
        adj[i].push(j); adj[j].push(i);
      }
    }
  }
  // 连通分量
  const comp = new Array(n).fill(-1);
  let compCnt = 0;
  for (let i = 0; i < n; i++) {
    if (comp[i] === -1) {
      const stack = [i]; comp[i] = compCnt;
      while (stack.length) {
        const u = stack.pop();
        for (const v of adj[u]) if (comp[v] === -1) { comp[v] = compCnt; stack.push(v); }
      }
      compCnt++;
    }
  }
  // 贪心染色（按开始时间排序）
  const lane = new Array(n).fill(0);
  const compLanes = new Array(compCnt).fill(0);
  const order = items.map((it, i) => i)
    .sort((a, b) => items[a].s - items[b].s || items[b].e - items[a].e);
  for (const i of order) {
    const used = new Set();
    for (const v of adj[i]) if (comp[v] === comp[i]) used.add(lane[v]);
    let l = 0;
    while (used.has(l)) l++;
    lane[i] = l;
    compLanes[comp[i]] = Math.max(compLanes[comp[i]], l + 1);
  }
  return items.map((it, i) => ({
    course: it.c, lane: lane[i], widthPct: 100 / compLanes[comp[i]]
  }));
}

function renderWeekSelector() {
  const container = document.getElementById('weekSelector');
  const weeksWithClass = new Set(courses.map(c => c.week));
  container.innerHTML = '';
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const btn = document.createElement('button');
    btn.className = 'week-btn' + (w === currentWeek ? ' active' : '') + (weeksWithClass.has(w) ? ' has-class' : '');
    btn.textContent = w;
    btn.onclick = () => { currentWeek = w; renderAll(); };
    container.appendChild(btn);
  }
}

function renderLegend() {
  const legend = document.getElementById('legend');
  let html = '';
  for (const [name, s] of Object.entries(SUBJECTS)) {
    html += `<div class="legend-item"><div class="legend-dot" style="background:linear-gradient(135deg,${s.main},${s.grad})"></div>${name}</div>`;
  }
  html += '<div class="legend-divider"></div>';
  html += `<div class="legend-item"><div class="legend-dot practice" style="border-color:#999"></div>见习课</div>`;
  html += `<div class="legend-note">（深色=理论课 / 教室课，浅色斜纹描边=见习课）</div>`;
  legend.innerHTML = html;
}

function renderDateInfo() {
  const dates = getWeekDates(currentWeek);
  document.getElementById('dateInfo').textContent =
    `第${currentWeek}周 · ${formatDate(dates[0])} - ${formatDate(dates[6])}`;
}

function renderGrid() {
  const grid = document.getElementById('scheduleGrid');
  const dates = getWeekDates(currentWeek);
  const today = new Date();
  today.setHours(0,0,0,0);
  let html = '';
  // 表头：时间列 + 7天
  html += '<div class="grid-header" style="border-bottom:2px solid #1a73e8">时间</div>';
  for (let i = 0; i < 7; i++) {
    const isToday = dates[i].getTime() === today.getTime();
    html += `<div class="grid-header${isToday ? ' today' : ''}">${DAY_NAMES[i]}<div class="date">${formatDate(dates[i])}</div></div>`;
  }
  // 时间列
  html += '<div class="time-col">';
  for (let h = START_HOUR; h < END_HOUR; h++) {
    html += `<div class="time-slot">${h}:00<br>${h+1}:00</div>`;
  }
  html += '</div>';
  // 每天的列
  const weekCourses = courses.filter(c => c.week === currentWeek);
  let anyCourse = false;
  for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
    const dayNum = dayIdx + 1; // 1=周一 ... 7=周日
    const dayCourses = weekCourses.filter(c => c.day === dayNum);
    if (dayCourses.length) anyCourse = true;
    const laidOut = layoutCourses(dayCourses);
    html += '<div class="day-col">';
    // 背景格子
    for (let h = START_HOUR; h < END_HOUR; h++) {
      html += '<div class="day-cell"></div>';
    }
    // 课程卡片
    laidOut.forEach(({ course: c, lane, widthPct }) => {
      const s = SUBJECTS[c.subject];
      const startMin = timeToMinutes(c.start);
      const endMin = timeToMinutes(c.end);
      const top = ((startMin - START_HOUR * 60) / 60) * HOUR_HEIGHT;
      const height = ((endMin - startMin) / 60) * HOUR_HEIGHT - 4;
      const left = lane * widthPct;
      const isNarrow = widthPct < 100;
      let style;
      if (c.type === 'practice') {
        style = `background:${s.light}; color:${s.text}; border-color:${s.main}; top:${top}px; height:${height}px; left:${left}%; width:calc(${widthPct}% - 6px);`;
      } else {
        style = `background:linear-gradient(135deg, ${s.main}, ${s.grad}); top:${top}px; height:${height}px; left:${left}%; width:calc(${widthPct}% - 6px);`;
      }
      const badge = c.type === 'practice' ? '见习' : '理论';
      html += `
        <div class="course-card ${c.type}${isNarrow ? ' narrow' : ''}" style="${style}"
             title="${c.subject} · ${c.name}\n教师：${c.teacher}\n教室：${c.room}\n时间：${c.start}-${c.end}\n类型：${badge}">
          <div class="badge">${badge}</div>
          <div class="course-name">${c.name}</div>
          <div class="course-meta">教师 ${c.teacher}<br>教室 ${c.room}<br>时间 ${c.start}-${c.end}</div>
        </div>`;
    });
    html += '</div>';
  }
  if (!anyCourse) {
    html = `<div class="empty-state" style="grid-column:1/-1"><div class="emoji">📅</div>第${currentWeek}周暂无排课</div>`;
  }
  grid.innerHTML = html;
}
function renderAll() {
  renderWeekSelector();
  renderDateInfo();
  renderLegend();
  renderGrid();
}
renderAll();
