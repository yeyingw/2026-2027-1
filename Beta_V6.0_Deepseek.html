      // ----- 解析CSV -----
      function parseCSV(text) {
        const lines = text.split("\n").filter((line) => line.trim() !== "");
        const result = [];
        for (let i = 1; i < lines.length; i++) {
          const row = parseCSVLine(lines[i]);
          if (row.length < 9) continue;
          const obj = {
            week: parseInt(row[0]),
            day: parseInt(row[1]),
            start: row[2].trim(),
            end: row[3].trim(),
            name: row[4].trim(),
            teacher: row[5].trim(),
            classroom: row[6].trim(),
            type: row[7].trim() === "见习" ? "practice" : "theory",
            subjectRaw: row[8].trim(),
          };
          let subject = subjectMap[obj.subjectRaw] || obj.subjectRaw;
          if (obj.subjectRaw.includes("外科见习")) subject = "外科学";
          else if (obj.subjectRaw.includes("内科见习")) subject = "内科学";
          else if (obj.subjectRaw.includes("皮肤见习")) subject = "皮肤性病学";
          else if (obj.subjectRaw.includes("耳鼻喉见习"))
            subject = "耳鼻咽喉头颈外科学";
          else if (obj.subjectRaw.includes("传染见习")) subject = "传染病学";
          obj.subject = subject;
          const groupMatch = obj.name.match(
            /【第([1-2])组】|第([1-2])组|第1、2组/,
          );
          if (groupMatch) {
            if (groupMatch[0] === "第1、2组") obj.group = "第1、2组";
            else obj.group = "第" + (groupMatch[1] || groupMatch[2]) + "组";
          } else {
            obj.group = "";
          }
          obj.full_name = obj.name;
          result.push(obj);
        }
        return result;
      }

      function parseCSVLine(line) {
        const parts = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            inQuotes = !inQuotes;
          } else if (ch === "," && !inQuotes) {
            parts.push(current);
            current = "";
          } else {
            current += ch;
          }
        }
        parts.push(current);
        return parts;
      }

      const courses = parseCSV(csvText);

      // ----- 渲染逻辑 -----
      const TOTAL_WEEKS = 17;
      const DAY_NAMES = [
        "周一",
        "周二",
        "周三",
        "周四",
        "周五",
        "周六",
        "周日",
      ];
      const START_HOUR = 8;
      const END_HOUR = 20;
      // 行高改为55px，与手机端CSS一致（电脑端也统一使用55，更舒适）
      const HOUR_HEIGHT = 55;
      const SEMESTER_START = new Date("2026-08-31");

      let currentWeek = 1;
      let hiddenSubjects = new Set();
      let currentGroup = "all";

      function getWeekDates(weekNum) {
        const dates = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(SEMESTER_START);
          d.setDate(d.getDate() + (weekNum - 1) * 7 + i);
          dates.push(d);
        }
        return dates;
      }
      function formatDate(d) {
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }
      function timeToMinutes(t) {
        if (!t) return 0;
        const [h, m] = t.split(":").map(Number);
        return h * 60 + (m || 0);
      }

      function renderWeekSelector() {
        const container = document.getElementById("weekSelector");
        const weeksWithClass = new Set(courses.map((c) => c.week));
        container.innerHTML = "";
        for (let w = 1; w <= TOTAL_WEEKS; w++) {
          const btn = document.createElement("button");
          btn.className =
            "week-btn" +
            (w === currentWeek ? " active" : "") +
            (weeksWithClass.has(w) ? " has-class" : "");
          btn.textContent = w;
          btn.onclick = () => {
            currentWeek = w;
            renderAll();
          };
          container.appendChild(btn);
        }
      }

      function renderDateInfo() {
        const dates = getWeekDates(currentWeek);
        document.getElementById("dateInfo").textContent =
          `第${currentWeek}周 · ${formatDate(dates[0])} - ${formatDate(dates[6])}`;
      }

      function renderSubjectFilters() {
        const container = document.getElementById("subjectFilters");
        const subjects = [...new Set(courses.map((c) => c.subject))];
        container.innerHTML = "";
        subjects.forEach((s) => {
          const chip = document.createElement("span");
          chip.className =
            "filter-chip" + (hiddenSubjects.has(s) ? " off" : "");
          chip.innerHTML = `<span class="dot" style="background:${subjectColors[s] || "#999"}"></span>${s}`;
          chip.onclick = () => {
            if (hiddenSubjects.has(s)) hiddenSubjects.delete(s);
            else hiddenSubjects.add(s);
            renderAll();
          };
          container.appendChild(chip);
        });
      }

      function renderLegend() {
        const container = document.getElementById("legend");
        const subjects = [...new Set(courses.map((c) => c.subject))];
        let html = "";
        subjects.forEach((s) => {
          html += `<div class="legend-item"><div class="legend-dot" style="background:${subjectColors[s] || "#999"}"></div>${s}</div>`;
        });
        html += `<div class="legend-item"><div class="legend-dot" style="background:#fff;border:2px dashed #999"></div>见习课(虚线边)</div>`;
        container.innerHTML = html;
      }

      function setGroup(g) {
        currentGroup = g;
        document.querySelectorAll(".group-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.group === g);
        });
        renderAll();
      }

      function getFilteredCourses() {
        return courses.filter((c) => {
          if (hiddenSubjects.has(c.subject)) return false;
          if (currentGroup !== "all" && c.group) {
            if (c.group.includes("第1、2组") || c.group.includes("第1,2组"))
              return true;
            if (currentGroup === "1" && !c.group.includes("1")) return false;
            if (currentGroup === "2" && !c.group.includes("2")) return false;
          }
          return true;
        });
      }

      // ----- 渲染课表（水平并排 + 点击事件）-----
      function renderGrid() {
        const grid = document.getElementById("scheduleGrid");
        const dates = getWeekDates(currentWeek);
        const filtered = getFilteredCourses();
        const weekCourses = filtered.filter((c) => c.week === currentWeek);

        let html = "";
        html +=
          '<div class="grid-header" style="border-bottom:2px solid #1a237e">时间</div>';
        for (let i = 0; i < 7; i++) {
          html += `<div class="grid-header">${DAY_NAMES[i]}<div class="date">${formatDate(dates[i])}</div></div>`;
        }

        // 时间列
        html += '<div class="time-col">';
        for (let h = START_HOUR; h < END_HOUR; h++) {
          html += `<div class="time-slot">${h}:00</div>`;
        }
        html += "</div>";

        for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
          const dayNum = dayIdx + 1;
          const dayCourses = weekCourses.filter((c) => c.day === dayNum);
          html += '<div class="day-col">';
          for (let h = START_HOUR; h < END_HOUR; h++) {
            html += '<div class="day-cell"></div>';
          }

          // 按时间段分组
          const timeGroups = {};
          dayCourses.forEach((c) => {
            const key = `${c.start}|${c.end}`;
            if (!timeGroups[key]) timeGroups[key] = [];
            timeGroups[key].push(c);
          });

          Object.values(timeGroups).forEach((group) => {
            const count = group.length;
            const gapPct = 0.8;
            const marginPct = 0.5;
            const totalGap = (count - 1) * gapPct + 2 * marginPct;
            const widthPct = (100 - totalGap) / count;

            group.forEach((c, idx) => {
              const leftPct = marginPct + idx * (widthPct + gapPct);
              const startMin = timeToMinutes(c.start);
              const endMin = timeToMinutes(c.end);
              const top = ((startMin - START_HOUR * 60) / 60) * HOUR_HEIGHT;
              const height = Math.max(
                ((endMin - startMin) / 60) * HOUR_HEIGHT - 3,
                30,
              );
              const color = subjectColors[c.subject] || "#666";
              const isPrac = c.type === "practice";
              const groupHtml = c.group
                ? `<span class="group-tag">${c.group}</span>`
                : "";
              const displayName = c.name.split("\n")[0];

              html += `
          <div class="course-card ${isPrac ? "practice" : ""}" 
               style="top:${top}px; height:${height}px; left:${leftPct}%; width:${widthPct}%; background:linear-gradient(135deg, ${color}, ${color}dd);"
               data-subject="${c.subject}"
               data-name="${c.full_name}"
               data-teacher="${c.teacher}"
               data-time="${c.start} - ${c.end}"
               data-group="${c.group || "全班"}"
               data-classroom="${c.classroom}"
               onclick="showDetail(this)">
            <div class="subject-tag">${c.subject}${isPrac ? " · 见习" : ""}</div>
            <div class="course-name">${displayName}</div>
            <div class="course-meta">👤 ${c.teacher}<br>⏰ ${c.start}-${c.end}</div>
            ${groupHtml}
          </div>
        `;
            });
          });

          html += "</div>";
        }

        grid.innerHTML = html;
      }

      // ----- 模态框显示详情 -----
      function showDetail(el) {
        const subject = el.dataset.subject;
        const name = el.dataset.name;
        const teacher = el.dataset.teacher;
        const time = el.dataset.time;
        const group = el.dataset.group;
        const classroom = el.dataset.classroom;

        document.getElementById("modalTitle").textContent = name;
        document.getElementById("modalDetail").innerHTML = `
    <div><span class="label">科目</span><span class="value">${subject}</span></div>
    <div><span class="label">教师</span><span class="value">${teacher}</span></div>
    <div><span class="label">时间</span><span class="value">${time}</span></div>
    <div><span class="label">组别</span><span class="value">${group}</span></div>
    <div><span class="label">教室</span><span class="value">${classroom}</span></div>
  `;
        document.getElementById("modalOverlay").classList.add("active");
      }

      document
        .getElementById("modalClose")
        .addEventListener("click", function () {
          document.getElementById("modalOverlay").classList.remove("active");
        });
      document
        .getElementById("modalOverlay")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            this.classList.remove("active");
          }
        });

      function renderStats() {
        const filtered = getFilteredCourses();
        const weekCourses = filtered.filter((c) => c.week === currentWeek);
        const theoryCount = weekCourses.filter(
          (c) => c.type === "theory",
        ).length;
        const practiceCount = weekCourses.filter(
          (c) => c.type === "practice",
        ).length;
        document.getElementById("stats").textContent =
          `第${currentWeek}周共 ${weekCourses.length} 节课（理论 ${theoryCount} · 见习 ${practiceCount}）`;
      }

      function renderAll() {
        renderWeekSelector();
        renderDateInfo();
        renderSubjectFilters();
        renderLegend();
        renderGrid();
        renderStats();
      }
      renderAll();
    </script>
  </body>
</html>
